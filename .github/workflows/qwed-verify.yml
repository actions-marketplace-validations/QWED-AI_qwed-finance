name: QWED Finance Verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      
      - uses: QWED-AI/qwed-finance@e93071b0298e82430f82e265a52905f8761183f3 # v3.0.0
        with:
          action: verify
          verification_type: npv
          cashflows: "-1000,200,300,400,500"
          rate: "0.10"
          llm_output: "$71.78"
          output_format: text
          fail_on_error: true
